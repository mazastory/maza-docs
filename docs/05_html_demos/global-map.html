<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZA Global Map Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #060b14; overflow: hidden; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .map-container {
            position: relative;
            width: 1000px;
            height: 500px;
            transform: scale(0.9);
        }

        .map-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.2;
            filter: invert(1) hue-rotate(180deg);
            pointer-events: none;
        }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        
        .ripple {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid;
            animation: rippleAnim 2.5s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        
        @keyframes rippleAnim {
            0% { width: 10px; height: 10px; opacity: 1; border-width: 2px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 0px; }
        }

        .tooltip {
            position: absolute;
            top: -35px; left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, 10px) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }

        #overlay-ui {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px 30px;
            border-radius: 16px;
            color: #fff;
            backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            min-width: 400px;
            transition: all 0.5s ease;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="map-container" id="map-wrap">
        <!-- SVG Map Background -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg" class="map-bg" alt="World Map">
        
        <div id="nodes-container"></div>
    </div>

    <div id="overlay-ui">
        <div class="text-sm text-slate-400 font-bold mb-2 tracking-widest uppercase">실시간 글로벌 타겟팅</div>
        <div id="current-lang" class="text-3xl font-black mb-2 transition-colors duration-500">영어 (English)</div>
        <div id="current-stats" class="text-sm text-slate-300"></div>
    </div>

    <script>
        // Coordinates based on 1000x500 map view
        const regions = [
            {
                lang: "미국 및 영어권 (English)",
                color: "#38bdf8", // Sky blue
                stats: "타겟 인구: <span class='text-white font-bold'>약 15억 명</span> | <span class='text-[#38bdf8] font-bold'>평균 CPC: $3.50+</span>",
                nodes: [
                    { x: '18%', y: '35%', label: '미국 (3.3억명)' },
                    { x: '47%', y: '30%', label: '영국 (6천만명)' },
                    { x: '85%', y: '75%', label: '호주 (2.6천만명)' },
                    { x: '22%', y: '25%', label: '캐나다 (3.8천만명)' }
                ]
            },
            {
                lang: "스페인어권 (Spanish)",
                color: "#f59e0b", // Amber
                stats: "타겟 인구: <span class='text-white font-bold'>약 5.4억 명</span> | <span class='text-[#f59e0b] font-bold'>평균 CPC: $1.80+</span>",
                nodes: [
                    { x: '45.5%', y: '40%', label: '스페인 (4.7천만명)' },
                    { x: '15%', y: '45%', label: '멕시코 (1.2억명)' },
                    { x: '25%', y: '65%', label: '남아메리카 지역' }
                ]
            },
            {
                lang: "독일어권 (German)",
                color: "#fbbf24", // Yellow
                stats: "타겟 인구: <span class='text-white font-bold'>약 1.3억 명</span> | <span class='text-[#fbbf24] font-bold'>평균 CPC: $2.50+</span>",
                nodes: [
                    { x: '48.5%', y: '34%', label: '독일 (8.3천만명)' },
                    { x: '49%', y: '36%', label: '스위스/오스트리아' }
                ]
            },
            {
                lang: "일본어 (Japanese)",
                color: "#ec4899", // Pink
                stats: "타겟 인구: <span class='text-white font-bold'>약 1.2억 명</span> | <span class='text-[#ec4899] font-bold'>평균 CPC: $2.80+</span>",
                nodes: [
                    { x: '88%', y: '38%', label: '일본 (1.2억명)' }
                ]
            },
            {
                lang: "포르투갈어권 (Portuguese)",
                color: "#22c55e", // Green
                stats: "타겟 인구: <span class='text-white font-bold'>약 2.6억 명</span> | <span class='text-[#22c55e] font-bold'>평균 CPC: $1.10+</span>",
                nodes: [
                    { x: '44%', y: '40.5%', label: '포르투갈' },
                    { x: '32%', y: '65%', label: '브라질 (2.1억명)' }
                ]
            },
            {
                lang: "프랑스어 (French)",
                color: "#a855f7", // Purple
                stats: "타겟 인구: <span class='text-white font-bold'>약 3억 명</span> | <span class='text-[#a855f7] font-bold'>평균 CPC: $1.50+</span>",
                nodes: [
                    { x: '47.5%', y: '36%', label: '프랑스 (6.7천만명)' },
                    { x: '49%', y: '55%', label: '아프리카 프랑스어권' }
                ]
            },
            {
                lang: "중국어 (Chinese)",
                color: "#ef4444", // Red
                stats: "타겟 인구: <span class='text-white font-bold'>약 14억 명</span> | <span class='text-[#ef4444] font-bold'>평균 CPC: $0.80+</span>",
                nodes: [
                    { x: '78%', y: '40%', label: '중국 (14억명)' },
                    { x: '80%', y: '45%', label: '대만/홍콩' }
                ]
            },
            {
                lang: "아랍어 (Arabic)",
                color: "#10b981", // Emerald
                stats: "타겟 인구: <span class='text-white font-bold'>약 4.2억 명</span> | <span class='text-[#10b981] font-bold'>평균 CPC: $1.20+</span>",
                nodes: [
                    { x: '58%', y: '45%', label: '중동 (사우디, UAE 등)' },
                    { x: '51%', y: '48%', label: '북아프리카 아랍권' }
                ]
            },
            {
                lang: "러시아어 (Russian)",
                color: "#64748b", // Slate
                stats: "타겟 인구: <span class='text-white font-bold'>약 2.5억 명</span> | <span class='text-[#64748b] font-bold'>평균 CPC: $0.90+</span>",
                nodes: [
                    { x: '65%', y: '25%', label: '러시아 (1.4억명)' },
                    { x: '55%', y: '30%', label: '동유럽/중앙아시아' }
                ]
            },
            {
                lang: "한국어 (Korean) 🇰🇷",
                color: "#475569", // Gloomy gray
                stats: "타겟 인구: <span class='text-white font-bold'>약 0.5억 명</span> | <span class='text-rose-500 font-bold'>평균 CPC: $0.10</span> 😭",
                isKorea: true,
                nodes: [
                    { x: '85%', y: '39%', label: '😭 한국 (5천만명)' }
                ]
            }
        ];

        const wait = ms => new Promise(res => setTimeout(res, ms));
        
        async function runLoop() {
            const container = document.getElementById('nodes-container');
            const langEl = document.getElementById('current-lang');
            const statsEl = document.getElementById('current-stats');
            const overlay = document.getElementById('overlay-ui');
            
            while(true) {
                for(let region of regions) {
                    // Fade out
                    container.innerHTML = '';
                    
                    if (region.isKorea) {
                        overlay.style.borderColor = '#ef444450';
                        overlay.style.boxShadow = `0 20px 40px rgba(239, 68, 68, 0.1)`;
                        langEl.style.color = '#94a3b8'; // Sad gray
                    } else {
                        overlay.style.borderColor = region.color + '40';
                        overlay.style.boxShadow = `0 20px 40px ${region.color}20`;
                        langEl.style.color = region.color;
                    }
                    
                    langEl.innerText = region.lang;
                    statsEl.innerHTML = region.stats;
                    
                    // Add nodes
                    region.nodes.forEach((n, idx) => {
                        const el = document.createElement('div');
                        el.className = 'node';
                        el.style.left = n.x;
                        el.style.top = n.y;
                        
                        if (region.isKorea) {
                            el.innerHTML = `
                                <div class="pulse" style="background: #ef4444; box-shadow: 0 0 10px #ef4444; width: 6px; height: 6px;"></div>
                                <div class="tooltip" style="color: #ef4444; border-color: #ef444450; font-size: 16px;">${n.label}</div>
                            `;
                        } else {
                            el.innerHTML = `
                                <div class="ripple" style="border-color: ${region.color}; animation-delay: ${idx * 0.3}s"></div>
                                <div class="ripple" style="border-color: ${region.color}; animation-delay: ${(idx * 0.3) + 1.25}s"></div>
                                <div class="pulse" style="background: ${region.color}; box-shadow: 0 0 20px 5px ${region.color}"></div>
                                <div class="tooltip" style="color: ${region.color}; border-color: ${region.color}50">${n.label}</div>
                            `;
                        }
                        container.appendChild(el);
                    });
                    
                    await wait(region.isKorea ? 4500 : 3500); // Give sad Korea a bit more time
                }
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            // scale container depending on window width
            function resizeMap() {
                const wrap = document.getElementById('map-wrap');
                const scale = Math.min(window.innerWidth / 1100, window.innerHeight / 600, 1);
                wrap.style.transform = `scale(${scale})`;
            }
            window.addEventListener('resize', resizeMap);
            resizeMap();
            
            runLoop();
        });
    </script>
</body>
</html>
